# TLP 1.10.1

# DO NOT COPY THIS FILE WITHOUT USING ./enable

# There are AC, BAL, and SAV *profiles*.
# The following determines what gets used when you are connected or on battery.
TLP_AUTO_SWITCH=1
TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=SAV

# Here is my explanation of what this configuration's profiles do:

# The AC profile (which could be confused with being connected to an AC power source)
# actually just means the "performance" profile. This profile is when you need your system to
# run as quickly as possible, regardless of how loud it will get.

# The BAL or BAT profile is selected when you are disconnected from a power source. This can
# have any meaning, but I have chosen the "BAL" meaning, which is just: I have a few demanding
# applications open that require some system power to be responsive. This profile results in higher
# performance at the cost of higher battery draw. Thermals and fan noise are not too noticeable.

# The SAV or 'savings' profile is the default on battery. With this profile you are still able to
# enjoy a responsive desktop experience at the cost of lowered performance, which is fine if your programs
# are GPU accelerated or hover at low CPU utilization.

# I think they meant to say "BAL" instead of "BAT",
# but the 2nd option refers to BAL.
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# The platform profile signals to the firmware how it should manage
# thermals and other tunings (conjecturally).
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# powersupersave -> powersave (bug?)
# This setting doesn't do much besides make micro-watt changes to PCIe devices,
# especially on a system where they aren't using much power anyways.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default
PCIE_ASPM_ON_SAV=powersave

# It's up to you to enable boost
# I find better savings without it.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0

# Specific to the ideapad_laptop driver. Stops at 80% charge.
# Get your driver with `tlp-stat -b`
START_CHARGE_THRESH_BAT0=0  # dummy value
STOP_CHARGE_THRESH_BAT0=1   # enables battery care

# Consider enabling these, if you find that they work in all cases.
# For me they don't if you plug AC in while the system is sleeping.
# Only bluetooth really matters.

#DEVICES_TO_ENABLE_ON_AC="bluetooth nfc wifi wwan"
#DEVICES_TO_DISABLE_ON_BAT="bluetooth nfc wwan"
