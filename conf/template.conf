# DO NOT COPY THIS FILE WITHOUT USING ./enable !!!
# THE FOLLOWING IS A SUBSTITUTION:

#INCLUDE_DRIVER#

CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power

PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# powersupersave -> powersave (bug?)
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default
PCIE_ASPM_ON_SAV=powersave

# It's up to you to enable boost
# I find better savings without it.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0

# Profiles
TLP_AUTO_SWITCH=1
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=SAV

# Specific to the ideapad_laptop driver. Stops at 80% charge.
START_CHARGE_THRESH_BAT0=0  # dummy value
STOP_CHARGE_THRESH_BAT0=1   # enables battery care

# Consider enabling these, if you find that they work in all cases.
# For me they don't if you plug AC in while the system is sleeping.
# Only bluetooth really matters.

#DEVICES_TO_ENABLE_ON_AC="bluetooth nfc wifi wwan"
#DEVICES_TO_DISABLE_ON_BAT="bluetooth nfc wwan"

